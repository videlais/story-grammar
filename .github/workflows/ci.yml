name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run all checks (lint, test, build)
      run: npm run all
      
    - name: Upload coverage reports
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true
      
    - name: Archive production artifacts
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: |
          dist/
          !dist/**/*.map
        retention-days: 30

  # Single gate job so branch protection can require a check literally named "CI"
  # (the matrix job above reports as "test (22.x)" / "test (24.x)", never "CI").
  CI:
    name: CI
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi